[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "leitor-bradesco-cnab400"
version = "1.0.0"
description = "Leitor e validador de arquivos de retorno Bradesco CNAB 400."
requires-python = ">=3.10"
authors = [{name = "Davi Martins Milhome"}]
dependencies = []

[project.scripts]
cnab400 = "cnab400.cli:main"

[tool.setuptools.packages.find]
include = ["cnab400*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
